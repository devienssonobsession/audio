<script>window.PAGE={"prenom":"Cindy","affirmations":["je suis une femme qui n’a pas besoin des messages de Jayden pour être heureuse","mon bonheur ne dépend que de moi et moi seule","Je reste calme, que Jayden écrive ou non.","je ne comble pas les silences que Jayden laisse, je fais autre chose","je reste dans mon énergie féminine et j’accepte de recevoir","Je pense à moi chaque jour, et ça me fait du bien.","Quand l'envie d'écrire à Jayden monte, je fais dix minutes d'autre chose.","Je n'ai pas besoin de tout porter pour être choisie.","Mon vendredi soir m'appartient, je le remplis comme j'en ai envie.","Mon besoin de clarté est légitime, il n'a rien d'excessif.","Le dimanche matin, j'ai déjà ma journée, sans attendre Jayden.","Je ne suis pas trop quand je dis ce que je ressens.","Je fixe mon week-end le jeudi, sans créneau « au cas où ».","Ma valeur ne change pas selon l'attention que Jayden me donne.","Je ne reste plus seule sur un quai à attendre Jayden.","Je peux aimer sans m'oublier, mon temps compte autant que le sien.","Je n'ai plus à tout expliquer en dix paragraphes pour mériter une réponse.","Je n'ai pas à prouver mon amour à Jayden pour être respectée.","Je peux vivre sans certaines questions sans réponses.","Mon besoin de vérité est une boussole, pas un défaut.","Je me fie à ce que j'ai vécu : les « j'arrive » sans actes, le quai de la gare du Nord.","Je peux rester tranquille sans réponse, je sais ce que je vaux.","Je suis fière de ma décision forte de ce matin-là.","Je ne cours pas après Jayden, je reste avec moi-même.","Je suis fière d'avoir posé une limite ce matin-là.","Je choisis des sorties qui me ressemblent : un resto, une balade.","Je mérite que les paroles de Jayden soient suivies d'actes.","Je pose mon téléphone loin du lit, mon sommeil m'appartient.","Je suis assez, même quand Jayden ne me rassure pas.","Je vois Jayden tel qu'il est, pas tel qu'il promet."],"audio":"audio.mp4","offre":"Audio + Analyse","stripe":""};</script>
