<script>window.PAGE={"prenom":"Marie","affirmations":["Je suis sereine et apaisée quand je croise Nicolas","Je rayonne quand je croise Nicolas","Je redeviens la femme pleine de folie et de gaieté","Je suis à nouveau la femme qu'on remarque quand j'arrive","Je ne veux plus que Nicolas ressente un malaise quand on se croise","Je dis bonjour à Nicolas d'une voix calme et je continue mon chemin.","Je n'ai pas besoin d'être disponible à toute heure pour être choisie.","Mon malaise m'appartient, je n'ai pas à porter celui de Nicolas.","Ma sérénité ne dépend pas du regard d'un homme.","Quand je croise Nicolas au foot, je regarde mes garçons et je respire.","Le silence de quelqu'un n'est pas un verdict sur ma valeur.","Je laisse le silence de mon téléphone tomber sur une vie déjà pleine.","Je n'ai pas honte d'avoir aimé vite et de tout mon cœur.","Mes trois rendez-vous de la semaine sont à moi, et je les tiens.","Ma valeur ne se mesure pas au nombre de messages reçus.","Je poste ce que j'aime, sans me demander si Nicolas regarde.","Je peux aimer fort sans me perdre dans l'intensité.","Le concert où il n'est pas venu ne dit rien de ma valeur.","Je n'ai pas à rayonner pour qu'on reste près de moi.","Si l'envie de lui écrire revient, j'attends trois jours et je choisis.","Ma gentillesse est une force, je la donne avec mes limites.","Ce que j'ai vécu cet été était vrai pour moi, et ça me suffit.","Je me fais confiance pour sentir ce qui est juste pour moi.","Je reste en paix, qu'il y ait quelqu'un d'autre dans sa vie ou non.","Je reste sur ma position de l'avoir bloqué et enlevé des réseaux.","À la sortie de l'école, je suis simplement une maman qui dit bonjour.","Les traumas de Nicolas lui appartiennent, je m'occupe de mon cœur à moi.","Je désire une relation stable avec Nicolas, et je la laisse venir doucement.","Avec Nicolas, je choisis la douceur plutôt que l'intensité de l'été.","Je me libère de ce malaise à l'école et au foot, je vis pour moi."],"audio":"audio.mp4","offre
