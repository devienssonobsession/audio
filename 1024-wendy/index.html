<script>window.PAGE={"prenom":"Wendy","affirmations":["Je reste en paix face au silence radio et je ne panique plus lorsque Murphy ne répond pas.","Je ne dépends plus de l'humeur des autres, de Murphy, pour me sentir bien et en sécurité.","Je ne suis plus dans l'attente d'un message, d'un appel ou d'une réponse de Murphy pour avancer dans ma vie.","Je ne rumine plus et je ne cherche plus constamment à comprendre le comportement de Murphy.","Je lâche prise sur ce que je ne peux pas contrôler et je retrouve ma paix intérieure, indépendamment des décisions de Murphy.","Mes pensées sont libres, et elles reviennent vers ma propre vie.","Je me détache émotionnellement de cette histoire, et ça me fait du bien.","Ma vie avance à mon rythme, et elle me plaît.","Je me recentre sur moi-même, et je me sens enfin à ma place.","Je suis patiente avec moi-même, et je laisse le temps faire son œuvre.","J'accepte que les décisions de Murphy lui appartiennent.","Mon bien-être est réel, et il vient de moi.","S'il doit revenir un jour, il reviendra, et moi je vis ma vie.","Je me sens légère, et mon cœur s'apaise jour après jour.","Je tourne la page avec douceur et je vais de l'avant.","Même si Murphy rencontre quelqu'un, je reste stable et en sécurité en moi.","Je suis apaisée avec ce que je sais, même sans toute la vérité.","Ma sérénité m'appartient, quoi que Murphy pense ou fasse.","Je fais ma part en toute confiance, et je lui laisse la sienne.","Cette histoire peut se clore en moi, sans dernière conversation.","J'ai reconnu mes torts, et je me pardonne pleinement.","Mon calme est solide, avec ou sans réponse.","Ma paix intérieure est déjà là, et je me l'offre maintenant.","Ma valeur est entière, quelle que soit la réponse des autres.","Je sais me rassurer moi-même, avec tendresse.","Je reste entière, même face au silence.","Mon amour est sincère, et il n'a pas besoin d'être rendu pour avoir de la valeur.","J'accueille mes émotions avec calme, et c'est moi qui choisis mes réactions.","Mon esprit est clair, et ma journée m'appartient.","J'ai eu le courage d'aimer et d'être honnête, et je suis fière de moi."],"audio":"audio.mp4","offre":"Audio"};</script>
