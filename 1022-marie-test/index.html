<script>window.PAGE={"prenom":"Marie test","affirmations":["Cette fille sur la photo reste une inconnue, et ma paix m'appartient.","J'avance à mon rythme, et mon rythme est le bon.","J'ai aimé de tout mon cœur, et c'était beau à donner.","Ce que j'ai ressenti avec Julien vit en moi et peut renaître.","Quatre mois après, mon cœur est exactement où il doit être.","J'aime avec de l'espace, et mon amour respire.","Un « haha » reste un « haha », et ma valeur reste entière.","Cette nuit chez lui fait partie de mon histoire, et ma dignité reste intacte.","À 23 h, mon téléphone dort hors de la chambre, et moi aussi.","Un message de 2 h du matin attend le matin, et moi je dors.","Je réponds en plein jour, en deux phrases chaleureuses, puis je vis ma journée.","Le soir, je remplace vos vieux messages par vingt minutes rien qu'à moi.","Nos anciens échanges reposent dans un dossier archivé, et mes pouces se détendent.","Son compte en sourdine, je regarde ma vie plutôt que ses likes.","Mon long message dort dans mes notes, daté, en sécurité.","Mes trois soirées de la semaine sont dans mon agenda, et je les tiens.","Je retrouve la fille sûre d'elle que j'étais avant Julien.","Mon téléphone est un simple objet posé, et ma vie est devant moi.","Je choisis mon film, mon dîner, mon sport, et je me choisis.","Mon calme prend sa source en moi, quoi qu'il arrive sur mon écran.","Onze mois fusionnels m'ont appris à aimer, et j'en garde la richesse.","Je tiens mes rendez-vous avec moi-même comme ceux avec les autres.","Julien a ses doutes à lui, et moi j'ai ma paix à moi.","Si Julien me veut, il sait où me trouver en plein jour.","Je désire un amour où Julien est sûr de lui, jour et nuit.","Je laisse Julien libre de ses choix et je reste fidèle aux miens.","Avec Julien, je reste chaleureuse et je garde mes heures à moi.","Dès que je me couche, la musique m'enveloppe et mon corps s'apaise.","Quand l'envie d'ouvrir ses stories monte, je respire, et mon corps se calme.","Je m'endors avec mes phrases à moi, et ma nuit est entière."],"audio":"audio.mp4","offre":"Audio"};</script>
