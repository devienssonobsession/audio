<script>window.PAGE={"prenom":"Alice","affirmations":["Je me sens pleinement puissante aimée et désirée auprès d’un homme qui sait aimer.","Je peux être pleinement moi même avec lui.","Je me sens aimée totalement et entièrement telle que je suis auprès de lui.","Je sais qu’il pose les actions justes et bonnes pour nous deux.","J’ai confiance en moi, en lui en nous et en la vie.","Quand un homme magnétique s'intéresse à moi, je reste là, et je reste moi.","Je n'ai pas à me diminuer pour qu'on me choisisse.","Je reste une minute de plus dans la conversation, et mon corps s'apaise.","Je peux être aimée sans me perdre ni m'oublier.","Je lâche le mode protection quand un regard se pose sur moi.","Je dis mon envie, le lieu, le plat, mon avis, et j'existe.","Ce que je ressens compte autant que ce que je vois chez lui.","Je dis non avec douceur quand au fond je sais que ça ne me convient pas.","Je n'ai pas besoin de garder mes distances pour me sentir en sécurité : je suis en sécurité en moi, même tout près de lui.","Je suis avec quelqu'un qui planifie de manière juste des moments avec moi.","Je peux recevoir ce qu'on m'offre sans me sentir redevable ni petite.","Je ne confonds plus ma fermeture avec un manque d'intérêt, c'est de la peur.","Mon besoin de profondeur n'est pas trop exigeant, il est juste.","Quand je pense à ceux qui me semblent à la hauteur, je reste à ma hauteur.","Je reste entière même quand quelqu'un me regarde vraiment.","Je ne rencontre plus des hommes juste pour éviter le risque.","Je n'attends plus d'être choisie, je me choisis déjà chaque jour.","Je reste là et je reste moi, je suis en sécurité.","Mon attirance compte, et je la prends au sérieux.","Je me libère de mes peurs vi-à-vis des autres et de moi.","Je souffre moins de mes anciennes blessures parce que je reste avec moi.","Avec celui qui saura m'inviter, je reçois l'invitation avec joie et simplicité.","Je suis assez belle et assez moi pour plaire à l'homme qui me verra.","Ensemble, nous rions, nous méditons, nous construisons, et tout reste fluide.","Je respire, je me sens en sécurité, et je laisse venir la sérénité."],"audio":"audio.mp4","offre":"Audio + Analyse","stripe":""};</script>
