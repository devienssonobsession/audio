<script>window.PAGE={"prenom":"Julie","affirmations":["Je suis apaisée et sereine dans mes relations.","Je suis en sécurité.","Je suis assez.","Je mérite d'être aimée.","Je suis calme quand Ludovic met du temps à me contacter","Je décroche quand j'en ai envie, pas par réflexe, quand Ludovic appelle.","Je n'ai pas besoin d'être disponible à toute heure pour être choisie.","Un appel manqué de Ludovic n'est pas une occasion perdue.","Mon passé de ghosting ne dit rien de ce que je vaux.","Quand Ludovic se tait plusieurs jours, je relis ce que je vaux, et je me le redis : je suis assez.","Je ne gagne pas le droit d'être choisie, je l'ai déjà.","Je cesse de compter les jours de silence de Ludovic.","Mon calme m'appartient, il ne dépend d'aucun téléphone.","Ma valeur est là, avec ou sans message de Ludovic, et je n'ai pas à la prouver.","Je n'ai pas à guérir un homme pour mériter sa présence.","Mes deux soirées par semaine m'appartiennent, avec ou sans Ludovic.","Je suis irremplaçable dans ma propre vie, et je m'y installe.","Je dis ma limite une seule fois, calmement, et je la tiens.","Ce qu'on me dit clairement, je le prends au sérieux, même quand ça fait mal.","Je garde ensemble « jamais amoureux » et « tu me manques », et je choisis en conscience.","Je n'ai pas honte d'avoir attendu, j'apprends maintenant à me choisir moi.","Son « c'est pas pour te blesser » ne décide pas de ce que je vaux.","Je suis digne d'être choisie, même quand ça ne se voit pas encore.","Un baiser refusé avant de partir ne mesure pas ma valeur.","Je ne suis en compétition avec aucune autre femme, ni avec « une autre ».","Je donne beaucoup parce que j'ai du cœur, pas pour être gardée.","Avec Ludovic, je veux un lien clair, où je n'ai plus à deviner.","Je peux me sentir en sécurité même sans nouvelles de personne.","Je suis ancrée et une confiance nouvelle grandit en moi.","Je me choisis en premier, chaque jour, avec douceur."],"audio":"audio.mp4","offre":"Audio + Analyse","stripe":""};</script>
