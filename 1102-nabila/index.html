<script>window.PAGE={"prenom":"Nabila","affirmations":["Je suis profondément, aimée, choisie et respectée.","Je mérite un amour sincère, stable et réciproque.","Je ne cours plus après l'amour","Je suis en paix avec moi même","Je suis une femme qui connaît sa valeur","Qu'il revienne de lui-même ou non, je reste entière.","Je n'écris plus quand il n'écrit pas : c'est mon choix, pas une punition.","Quand Kevin disparaît plusieurs jours, ma journée reste pleine et continue.","Je veux une relation où je sais clairement où je me situe.","Je veux un homme qui vient vers moi par envie, sans que j'aie à lui rappeler que j'existe.","Je ne regarde plus mon téléphone en espérant un message.","Je veux des actes de Kevin, pas seulement des « je t'aime » entre deux silences.","Je ne compte plus les heures ni les jours sans nouvelles.","Je ne panique plus quand il ne répond pas.","Un simple émoticône ne demande rien de moi.","Je confie mes émotions à mes propres mains.","Je peux laisser de l'espace sans craindre qu'on m'oublie.","Ma valeur ne dépend pas de l'attention qu'un homme me porte.","Je ne réclame plus le minimum : je choisis ce qui m'est offert librement.","Je laisse la peur d'être oubliée se calmer sans courir.","Je suis heureuse, sereine et épanouie, même quand il n'est pas présent.","Ma sensibilité est un don, pas une dette envers qui que ce soit.","Avec Kevin, je veux de la tendresse sans réclamer le minimum.","Il peut savoir que j'existe sans que j'aie besoin d'une story ni d'un silence calculé.","Je peux aimer Kevin et rester sereine quand il n'est pas là.","Je veux un amour fidèle, tendre, complice et réciproque, et je sais le reconnaître.","Je ne partage plus ma place dans une relation floue.","Je veux que Kevin prenne une vraie décision, et je ne reste pas suspendue à son choix.","Je garde mon désir et ma tendresse pour Kevin sans devenir froide ni dépendante.","Je veux que Kevin me choisisse pleinement, et je sais ce qu'il me faut pour rester."],"audio":"audio.mp4","offre":"Audio + Analyse","stripe":""};</script>
